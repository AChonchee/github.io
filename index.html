    /* ============================================================
   เกมท่องคำ "ประเทศต่างๆ"  (ต่อยอดจากเกมหมูหมากาไก่)
   ไฟล์เดียวจบ - ไม่พึ่ง CDN, ไม่ต้องต่อเน็ต
   ============================================================ */
    /* ============================================================
   เกมท่องคำ "ธงชาติ"  (ต่อยอดจากเกมหมูหมากาไก่)
   ไฟล์เดียวจบ - ไม่พึ่ง CDN, ไม่ต้องต่อเน็ต
   ============================================================ */
    :root {
      --spot-x: 50%;
      --spot-y: 50%;
      --r-inner: 120px;
      --r-outer: 180px;
      --ink: #f8fafc;
      /* โทนพื้นหลัง: กรมท่าเข้ม -> เกือบดำ (อยากได้ดำสนิทให้ตั้งทั้งสามค่าเป็น #000) */
      --bg-1: #0b1220;
      --bg-2: #131c33;
      --bg-3: #080b14;
    }

    * {
      box-sizing: border-box
    }

    html,
    body {
      margin: 0;
      padding: 0
    }

    body {
      min-height: 100vh;
      font-family: "Prompt", "Leelawadee UI", "Segoe UI", system-ui, -apple-system, Roboto, Helvetica, Arial,
        "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif;
      color: var(--ink);
      background: linear-gradient(160deg, var(--bg-1) 0%, var(--bg-2) 45%, var(--bg-3) 100%);
      background-attachment: fixed;
    }

    .wrap {
      max-width: 1180px;
      margin: 0 auto;
      padding: 24px 16px 8px
    }

    /* ---------- header ---------- */
    header {
      display: flex;
      flex-direction: column;
      gap: 18px
    }

    @media(min-width:900px) {
      header {
        flex-direction: row;
        align-items: flex-end;
        justify-content: space-between
      }
    }

    h1 {
      font-size: 1.6rem;
      line-height: 1.25;
      margin: 0;
      font-weight: 800;
      letter-spacing: -.02em
    }

    @media(min-width:900px) {
      h1 {
        font-size: 2rem
      }
    }

    .subtitle {
      margin: .35rem 0 0;
      color: rgba(224, 231, 255, .9);
      font-size: .92rem
    }

    .panel {
      display: flex;
      flex-direction: column;
      gap: 10px
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: .45rem;
      border: 0;
      cursor: pointer;
      font-family: inherit;
      font-size: .95rem;
      font-weight: 600;
      padding: .55rem .95rem;
      border-radius: .65rem;
      background: rgba(255, 255, 255, .18);
      color: #fff;
      transition: background .15s ease, transform .1s ease, opacity .15s ease;
    }

    .btn:hover {
      background: rgba(255, 255, 255, .26)
    }

    .btn:active {
      transform: translateY(1px)
    }

    .btn:disabled {
      opacity: .45;
      cursor: not-allowed
    }

    .btn-primary {
      background: #34d399;
      color: #053b2c;
      box-shadow: 0 6px 18px rgba(16, 185, 129, .35)
    }

    .btn-primary:hover {
      background: #6ee7b7
    }

    .btn.on {
      background: #fde047;
      color: #422006
    }

    .row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: .5rem
    }

    .lbl {
      font-size: .75rem;
      color: rgba(255, 255, 255, .8)
    }

    .tiny {
      font-size: .68rem;
      color: rgba(255, 255, 255, .7)
    }

    input[type=range] {
      width: 190px;
      accent-color: #fde047;
      cursor: pointer
    }

    .pill {
      width: 34px;
      height: 34px;
      border: 0;
      border-radius: 999px;
      cursor: pointer;
      font-family: inherit;
      font-weight: 800;
      font-size: .85rem;
      background: rgba(255, 255, 255, .16);
      color: #fff;
      transition: all .15s ease;
    }

    .pill:hover {
      background: rgba(255, 255, 255, .3)
    }

    .pill.active {
      background: #fff;
      color: var(--bg-1);
      box-shadow: 0 4px 12px rgba(0, 0, 0, .4)
    }

    /* ---------- stage ---------- */
    .stage {
      margin-top: 22px;
      background: rgba(255, 255, 255, .05);
      border: 1px solid rgba(255, 255, 255, .1);
      border-radius: 1.15rem;
      padding: 16px;
      backdrop-filter: blur(4px);
      position: relative;
    }

    .setbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 12px;
      flex-wrap: wrap
    }

    .setname {
      font-weight: 600;
      font-size: 1rem
    }

    .setname span {
      color: #fde047
    }

    .progress {
      height: 6px;
      border-radius: 99px;
      background: rgba(255, 255, 255, .18);
      overflow: hidden;
      flex: 1;
      min-width: 120px
    }

    .progress>i {
      display: block;
      height: 100%;
      width: 0;
      background: #fde047;
      transition: width .25s ease
    }

    #gridWrapper {
      position: relative
    }

    /* แถวบน 4 ใบ แถวล่าง 3 ใบ จัดกึ่งกลาง -> ใช้ flex-wrap ไม่ใช่ grid */
    #cardsGrid {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 14px
    }

    .card {
      flex: 0 0 calc(50% - 7px);
      background: rgba(255, 255, 255, .045);
      border: 1px solid rgba(255, 255, 255, .1);
      border-radius: .9rem;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      align-items: center;
    }

    @media(min-width:760px) {
      #cardsGrid {
        gap: 18px
      }

      .card {
        flex: 0 0 calc(25% - 13.5px)
      }
    }

    .flagbox {
      width: 100%;
      aspect-ratio: 3/2;
      border-radius: .55rem;
      overflow: hidden;
      background: rgba(255, 255, 255, .08);
      box-shadow: 0 6px 16px rgba(0, 0, 0, .3);
      transition: outline .2s ease, box-shadow .2s ease, transform .2s ease;
      outline: 2px solid rgba(255, 255, 255, .15);
    }

    .flagbox svg {
      display: block;
      width: 100%;
      height: 100%
    }

    /* ปุ่มเฉลย: ปุ่มเดียวสลับ 2 สถานะ ความสูงคงที่เพื่อไม่ให้การ์ดกระโดด */
    .answer {
      width: 100%;
      height: 2.5rem;
      border: 0;
      cursor: pointer;
      font-family: inherit;
      display: flex;
      align-items: center;
      justify-content: center;
      white-space: nowrap;
      overflow: hidden;
      border-radius: .55rem;
      padding: 0 .3rem;
      background: rgba(255, 255, 255, .15);
      color: rgba(255, 255, 255, .8);
      font-size: .82rem;
      font-weight: 600;
      transition: background .18s ease, color .18s ease, font-size .18s ease;
    }

    .answer:hover {
      background: rgba(255, 255, 255, .26)
    }

    .answer.revealed {
      background: transparent;
      color: #fff;
      font-size: 1.05rem;
      font-weight: 800;
      text-shadow: 0 2px 8px rgba(0, 0, 0, .35);
    }

    @media(min-width:760px) {
      .answer {
        height: 3rem;
        font-size: .9rem
      }

      .answer.revealed {
        font-size: 1.4rem
      }
    }

    .card.hit .flagbox {
      outline: 4px solid #facc15;
      box-shadow: 0 0 0 8px rgba(250, 204, 21, .18), 0 12px 30px rgba(0, 0, 0, .4), 0 0 44px rgba(250, 204, 21, .4);
      transform: translateY(-3px) scale(1.02);
    }

    .card.hit .answer.revealed {
      color: #fde047
    }

    .spotlight {
      pointer-events: none;
      position: absolute;
      inset: 0;
      z-index: 5;
      border-radius: 1rem;
      background: radial-gradient(circle at var(--spot-x) var(--spot-y),
          rgba(0, 0, 0, 0) 0px, rgba(0, 0, 0, 0) var(--r-inner), rgba(0, 0, 0, .8) var(--r-outer));
      transition: background 380ms ease;
      opacity: 0;
    }

    .spotlight.on {
      opacity: 1
    }

    /* ---------- overlays ---------- */
    .overlay {
      position: absolute;
      inset: 0;
      z-index: 10;
      display: none;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 14px;
      background: rgba(0, 0, 0, .72);
      backdrop-filter: blur(3px);
      border-radius: 1rem;
    }

    .overlay.show {
      display: flex
    }

    .bubble {
      width: 7rem;
      height: 7rem;
      border-radius: 999px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 3rem;
      color: #0f172a;
      background: linear-gradient(135deg, #fde047, #fb7185);
      box-shadow: 0 20px 50px rgba(0, 0, 0, .4), inset 0 0 0 10px rgba(255, 255, 255, .22);
      animation: pop 300ms ease-out;
    }

    .chant-emoji {
      font-size: 5rem;
      line-height: 1;
      animation: pop 260ms ease-out
    }

    .chant-word {
      font-size: 3.4rem;
      font-weight: 800;
      color: #fde047;
      text-shadow: 0 6px 24px rgba(0, 0, 0, .5);
      animation: pop 260ms ease-out
    }

    @media(min-width:760px) {
      .chant-emoji {
        font-size: 7rem
      }

      .chant-word {
        font-size: 5rem
      }
    }

    .chant-dots {
      display: flex;
      gap: 10px
    }

    .chant-dots i {
      width: 12px;
      height: 12px;
      border-radius: 99px;
      background: rgba(255, 255, 255, .3)
    }

    .chant-dots i.on {
      background: #fde047
    }

    @keyframes pop {
      0% {
        transform: scale(.55);
        opacity: 0
      }

      60% {
        transform: scale(1.08);
        opacity: 1
      }

      100% {
        transform: scale(1);
        opacity: 1
      }
    }

    .notice {
      margin-top: 10px;
      font-size: .78rem;
      padding: .5rem .75rem;
      border-radius: .55rem;
      background: rgba(253, 224, 71, .15);
      border: 1px solid rgba(253, 224, 71, .4);
      color: #fef9c3;
      display: none;
    }

    .notice.show {
      display: block
    }

    footer {
      margin-top: 28px;
      padding: 18px;
      text-align: center;
      font-size: .8rem;
      color: rgba(255, 255, 255, .6);
      border-top: 1px solid rgba(255, 255, 255, .12)
    }

    @media(prefers-reduced-motion:reduce) {
      * {
        animation-duration: .01ms !important;
        transition-duration: .01ms !important
      }
    }
  </style>
</head>

<body>
  <div class="wrap">
    <header>
      <div>
        <h1>เกมท่องคำ ธงชาติ 🌏</h1>
        <p class="subtitle">ทายธง 7 ประเทศ • สุ่มใหม่ทุกชุด 4 + 3 ใบ • 10 ชุด • เริ่มด้วย “หมู หมา กา ไก่”</p>
      </div>

      <div class="panel">

              id="playText">เล่น</span></button>

          <button id="ttsBtn" class="btn" title="เสียงเฉลยชื่อประเทศ">🔈</button>
          <button id="musicBtn" class="btn on" title="เพลงประกอบ">🎵</button>

          <span id="musicName" class="tiny" title="sound01.mp3">sound01.mp3</span>
          <input id="volume" type="range" min="0" max="100" step="5" value="60" style="width:110px"
            title="ระดับเสียงเพลง">

          <span class="lbl">ความเร็ว:</span>
          <input id="speed" type="range" min="1" max="5" step="1" value="3">
          <span class="tiny">ช้า</span>
          <span class="lbl" id="speedLabel" style="font-weight:600">ระดับ 3</span>
          <span class="tiny">เร็ว</span>
        </div>
        <div class="row">
          <span class="lbl">จำนวนชุด:</span>
          <button id="count5" class="btn" style="padding:.35rem .8rem;font-size:.85rem">5 ชุด</button>
          <button id="count10" class="btn on" style="padding:.35rem .8rem;font-size:.85rem">10 ชุด</button>
        </div>

    </header>

    <section class="stage">
      <div class="setbar">
        <div class="setname">ชุด <span id="setNo">1</span>/<span id="setTotal">10</span></div>
        <div class="progress"><i id="bar"></i></div>
      </div>

      <div id="gridWrapper">
        <div id="cardsGrid"></div>
        <div id="spotlight" class="spotlight"></div>

        <div id="countdown" class="overlay">
          <div id="countText" class="bubble">3</div>
        </div>

        <div id="chant" class="overlay">
          <div id="chantEmoji" class="chant-emoji">🐷</div>
          <div id="chantWord" class="chant-word">หมู</div>
          <div class="chant-dots" id="chantDots"><i></i><i></i><i></i><i></i></div>
        </div>
      </div>

      <div id="notice" class="notice"></div>
    </section>

    <audio id="bgm" loop preload="auto" src="sound01.mp3"></audio>

    <footer>เกมฝึกท่องคำสำหรับห้องเรียน • ธงชาติวาดด้วย SVG ในไฟล์ (ภาพประกอบแบบย่อ) • ใช้งานออฟไลน์ได้</footer>
  </div>

  <script>
    "use strict";
    /* ==========================================================================
       1) FLAG ENGINE — เครื่องวาดธงเป็น SVG  (กรอบ 90 x 60 = อัตราส่วน 3:2)
       ========================================================================== */
    const W = 90, H = 60;
    const R = (x, y, w, h, f) => `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${f}"/>`;
    const C = (cx, cy, r, f) => `<circle cx="${cx}" cy="${cy}" r="${r}" fill="${f}"/>`;
    const P = (pts, f) => `<polygon points="${pts}" fill="${f}"/>`;
    const BG = f => R(0, 0, W, H, f);

    /** ดาว n แฉก */
    function starPts(cx, cy, ro, ri, n = 5, rot = -90) {
      const out = [];
      for (let i = 0; i < n * 2; i++) {
        const r = i % 2 ? ri : ro;
        const a = (rot + i * 180 / n) * Math.PI / 180;
        out.push(`${(cx + r * Math.cos(a)).toFixed(2)},${(cy + r * Math.sin(a)).toFixed(2)}`);
      }
      return out.join(' ');
    }
    const STAR = (cx, cy, r, f, n = 5, rot = -90, k = .382) => P(starPts(cx, cy, r, r * k, n, rot), f);

    /** แถบแนวนอน / แนวตั้ง (weights ไม่ใส่ = แบ่งเท่ากัน) */
    function hS(colors, weights) {
      const ws = weights || colors.map(() => 1);
      const total = ws.reduce((a, b) => a + b, 0);
      let y = 0, out = '';
      colors.forEach((c, i) => { const h = H * ws[i] / total; out += R(0, y, W, h + .4, c); y += h; });
      return out;
    }
    function vS(colors, weights) {
      const ws = weights || colors.map(() => 1);
      const total = ws.reduce((a, b) => a + b, 0);
      let x = 0, out = '';
      colors.forEach((c, i) => { const w = W * ws[i] / total; out += R(x, 0, w + .4, H, c); x += w; });
      return out;
    }

    const L = (d, s, w) => `<path d="${d}" stroke="${s}" stroke-width="${w}" fill="none"/>`;

    /** ธงยูเนียนแจ็ก — ใช้ทั้งในธงอังกฤษ และย่อลงมุมซ้ายบนของธงออสเตรเลีย */
    function unionJack() {
      return BG('#012169')
        + L('M0,0 L90,60 M90,0 L0,60', '#ffffff', 13)
        + L('M0,0 L90,60 M90,0 L0,60', '#C8102E', 5)
        + L('M45,0 V60 M0,30 H90', '#ffffff', 17)
        + L('M45,0 V60 M0,30 H90', '#C8102E', 10);
    }

    const svg = inner => `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none" role="img">${inner}</svg>`;

    /* ==========================================================================
       2) บ่อประเทศ — 7 ประเทศ ใช้สุ่มลงการ์ดทุกชุด
       ========================================================================== */
    const POOL = [
      {
        th: 'สหรัฐอเมริกา', f: () => {
          let s = '';
          for (let i = 0; i < 13; i++) s += R(0, i * H / 13, W, H / 13 + .3, i % 2 ? '#fff' : '#B22234');
          const cw = W * .4, ch = H * 7 / 13;
          s += R(0, 0, cw, ch, '#3C3B6E');
          for (let row = 0; row < 9; row++) {
            const y = ch * (row + 1) / 10, six = row % 2 === 0;
            const n = six ? 6 : 5;
            for (let j = 0; j < n; j++) {
              const x = six ? (2 * j + 1) * cw / 12 : (j + 1) * cw / 6;
              s += STAR(x, y, 1.35, '#fff');
            }
          }
          return s;
        }
      },

      { th: 'ฝรั่งเศส', f: () => vS(['#002395', '#FFFFFF', '#ED2939']) },

      { th: 'อังกฤษ', f: () => unionJack() },

      {
        th: 'จีน', f: () => BG('#EE1C25') + STAR(15, 13, 8, '#FFDE00')
          + STAR(30, 6, 3, '#FFDE00', 5, -70) + STAR(35, 13, 3, '#FFDE00', 5, -80)
          + STAR(35, 21, 3, '#FFDE00', 5, -100) + STAR(29, 27, 3, '#FFDE00', 5, -115)
      },

      {
        th: 'ออสเตรเลีย', f: () => BG('#012169')
          + `<g transform="scale(0.5)">${unionJack()}</g>`   // ยูเนียนแจ็กย่อลงมุมซ้ายบน
          + STAR(22.5, 45, 6, '#fff', 7)                          // ดาวสหพันธ์ 7 แฉก ใต้แจ็ก
          + STAR(64, 10, 3.4, '#fff', 7)                          // กลุ่มดาวกางเขนใต้
          + STAR(58, 28, 3.4, '#fff', 7)
          + STAR(70, 25, 3.4, '#fff', 7)
          + STAR(64, 44, 3.4, '#fff', 7)
          + STAR(76, 35, 2, '#fff', 5)
      },

      { th: 'ญี่ปุ่น', f: () => BG('#fff') + C(45, 30, 17, '#BC002D') },

      { th: 'ไทย', f: () => hS(['#A51931', '#F4F5F8', '#2D2A4A', '#F4F5F8', '#A51931'], [1, 1, 2, 1, 1]) }
    ];

    /** จำนวนการ์ดต่อแถว — สุ่มแยกกันแถวละกลุ่ม (ข้ามแถวซ้ำกันได้) */
    const ROW_SIZES = [4, 4];
    const PER_SET = ROW_SIZES.reduce((a, b) => a + b, 0);

    /** สุ่มหยิบ n ตัวจาก arr แบบไม่ซ้ำภายในกลุ่ม */
    function sample(arr, n) {
      const a = arr.slice();
      for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1));[a[i], a[j]] = [a[j], a[i]]; }
      return a.slice(0, n);
    }
    /** แจกไพ่ 1 ชุด: แถวบน 4 ใบ + แถวล่าง 3 ใบ */
    function dealSet() {
      return ROW_SIZES.flatMap(n => sample(POOL, n));
    }

    /* ==========================================================================
       3) ระบบเสียง — เพลงพื้นหลัง (ไฟล์เสียง) + เสียงอ่านไทย (Web Speech)
       ========================================================================== */
    /** เพลงพื้นหลัง — ใช้ไฟล์จริงจากโฟลเดอร์ Song ข้าง index.html
     *  เปลี่ยนเพลงถาวร = แทนที่ไฟล์ที่ MUSIC_SRC ชี้ไป
     *  เปลี่ยนเฉพาะรอบนี้  = กดปุ่ม "เลือกเพลง" ในหน้าเกม */
    const MUSIC_SRC = 'sound01.mp3';
    const Music = {
      el: null, objectUrl: null, failed: false,

      init(el) {
        this.el = el;
        el.loop = true;
        el.volume = state.volume;
        el.addEventListener('error', () => { this.failed = true; updateMusicNotice(); });
        el.addEventListener('canplay', () => { this.failed = false; updateMusicNotice(); });
      },

      /** เริ่มเพลงจากต้น — ต้องถูกเรียกจาก user gesture (ปุ่มเล่น) ตามนโยบาย autoplay */
      play() {
        if (!this.el || !state.musicOn) return;
        try {
          this.el.currentTime = 0;
          const p = this.el.play();
          if (p && p.catch) p.catch(() => { this.failed = true; updateMusicNotice(); });
        } catch (e) { this.failed = true; updateMusicNotice(); }
      },
      /** เล่นต่อโดยไม่กรอกลับ (ใช้ตอนกดเปิดเพลงกลางเกม) */
      resume() {
        if (!this.el || !state.musicOn) return;
        const p = this.el.play();
        if (p && p.catch) p.catch(() => { });
      },
      stop() {
        if (!this.el) return;
        this.el.pause();
        try { this.el.currentTime = 0; } catch (e) { }
      },
      pause() { if (this.el) this.el.pause(); },

      setVolume(v) {
        state.volume = v;
        if (this.el) this.el.volume = v;
      },

      /** ไฟล์ที่ครูเลือกเอง — มีผลเฉพาะรอบการใช้งานนี้ */
      loadFile(file) {
        if (!this.el || !file) return;
        if (this.objectUrl) URL.revokeObjectURL(this.objectUrl);
        this.objectUrl = URL.createObjectURL(file);
        this.failed = false;
        const wasPlaying = !this.el.paused;
        this.el.src = this.objectUrl;
        this.el.load();
        if (wasPlaying) this.resume();
        musicName.textContent = file.name.length > 24 ? file.name.slice(0, 22) + '…' : file.name;
        musicName.title = file.name;
      }
    };

    const Voice = {
      thai: null, ready: false,
      scan() {
        if (!('speechSynthesis' in window)) return;
        const vs = speechSynthesis.getVoices();
        this.thai = vs.find(v => /^th(-|_)?/i.test(v.lang)) || null;
        this.ready = vs.length > 0;
      },
      /** force = true สำหรับท่อนเปิด "หมู หมา กา ไก่" ซึ่งไม่ใช่คำเฉลย
       *  จึงพูดได้แม้ปุ่มเสียงเฉลย (🔊) จะปิดอยู่ */
      say(text, force) {
        if ((!state.ttsOn && !force) || !('speechSynthesis' in window) || !this.thai) return;
        speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(text);
        u.voice = this.thai; u.lang = this.thai.lang; u.rate = 1.05; u.pitch = 1;
        speechSynthesis.speak(u);
      },
      stop() { if ('speechSynthesis' in window) speechSynthesis.cancel(); }
    };
    // หมายเหตุ: สแกนเสียงครั้งแรกทำในบล็อก boot ท้ายไฟล์ เพราะ updateVoiceNotice()
    // ต้องใช้ state / noticeEl ซึ่งประกาศอยู่ในส่วนที่ 4 (ถ้าเรียกที่นี่จะติด Temporal Dead Zone)
    if ('speechSynthesis' in window) {
      speechSynthesis.addEventListener('voiceschanged', () => { Voice.scan(); updateVoiceNotice(); });
    }

    /* ==========================================================================
       4) สถานะเกม + องค์ประกอบหน้าจอ
       ========================================================================== */
    const SET_CHOICES = [5, 10];                   // ตัวเลือกจำนวนชุดต่อรอบ
    const SPEED_MS = { 1: 1500, 2: 1100, 3: 800, 4: 600, 5: 400 };
    const TTS_MIN_MS = 800;                       // มีเสียงเฉลย -> ช้าสุดได้ 800ms ไม่งั้นเสียงถูกตัด
    const CHANT = [['🐷', 'หมู'], ['🐶', 'หมา'], ['🐦', 'กา'], ['🐔', 'ไก่']];
    const CHANT_MS = 620;                         // จังหวะต่อคำของท่อนเปิด

    const state = {
      set: 0, idx: 0, playing: false, busy: false, starting: false,
      timer: null, deal: [], answers: [],
      setCount: 10, level: 3, ttsOn: false, musicOn: true, volume: .6
    };

    const $ = id => document.getElementById(id);
    const grid = $('cardsGrid'), wrapper = $('gridWrapper'), spotlight = $('spotlight');
    const setPills = $('setPills'), playBtn = $('togglePlay'), playIcon = $('playIcon'), playText = $('playText');
    const speedEl = $('speed'), speedLabel = $('speedLabel'), setNo = $('setNo'), setTotal = $('setTotal'), bar = $('bar');
    const countBtns = { 5: $('count5'), 10: $('count10') };
    const cdOverlay = $('countdown'), cdText = $('countText');
    const chantOverlay = $('chant'), chantEmoji = $('chantEmoji'), chantWord = $('chantWord'), chantDots = $('chantDots');
    const revealAllBtn = $('revealAllBtn'), noticeEl = $('notice');
    const bgm = $('bgm'), musicBtn = $('musicBtn'), musicFile = $('musicFile'), musicName = $('musicName'), volumeEl = $('volume');

    const wait = ms => new Promise(r => setTimeout(r, ms));
    const HIDDEN_LABEL = 'เฉลย ❓';
    function tickMs() {
      const ms = SPEED_MS[state.level];
      return (state.ttsOn && Voice.thai) ? Math.max(ms, TTS_MIN_MS) : ms;
    }

    /* ---------- ปุ่มเฉลย ---------- */
    function setAnswer(btn, show) {
      btn.classList.toggle('revealed', show);
      btn.textContent = show ? btn.dataset.name : HIDDEN_LABEL;
      btn.setAttribute('aria-pressed', show ? 'true' : 'false');
    }
    function allRevealed() {
      return state.answers.length > 0 && state.answers.every(b => b.classList.contains('revealed'));
    }
    function syncRevealAll() {
      const on = allRevealed();
      revealAllBtn.textContent = on ? '🙈 ซ่อนทั้งหมด' : '👁 เฉลยทั้งหมด';
      revealAllBtn.classList.toggle('on', on);
    }

    /* ---------- render ---------- */
    function buildPills() {
      setPills.innerHTML = '';
      for (let i = 0; i < state.setCount; i++) {
        const b = document.createElement('button');
        b.className = 'pill'; b.textContent = i + 1; b.title = 'ชุดที่ ' + (i + 1) + ' (สุ่มธงใหม่)';
        b.addEventListener('click', () => { if (state.playing) stop(); goToSet(i); });
        setPills.appendChild(b);
      }
    }
    function buildCards() {
      grid.innerHTML = '';
      state.answers = [];
      for (let pos = 0; pos < PER_SET; pos++) {
        const it = state.deal[pos];

        const card = document.createElement('div');
        card.className = 'card'; card.dataset.pos = pos;

        const box = document.createElement('div');
        box.className = 'flagbox';
        box.innerHTML = svg(it.f());

        const btn = document.createElement('button');
        btn.className = 'answer'; btn.type = 'button';
        btn.dataset.name = it.th;
        btn.textContent = HIDDEN_LABEL;
        btn.setAttribute('aria-pressed', 'false');
        btn.setAttribute('aria-label', 'เฉลยชื่อประเทศ');
        btn.addEventListener('click', () => {
          setAnswer(btn, !btn.classList.contains('revealed'));
          syncRevealAll();
        });

        card.appendChild(box);
        card.appendChild(btn);
        grid.appendChild(card);
        state.answers.push(btn);
      }
      syncRevealAll();
    }
    function renderSet() {
      buildCards();
      setNo.textContent = state.set + 1;
      setTotal.textContent = state.setCount;
      [...setPills.children].forEach((b, i) => b.classList.toggle('active', i === state.set));
      highlight();
      moveSpotlight(true);
      updateBar();
    }
    function updateBar() {
      const done = state.set * PER_SET + (state.playing ? state.idx + 1 : 0);
      bar.style.width = (done / (state.setCount * PER_SET) * 100).toFixed(1) + '%';
    }
    function highlight() {
      [...grid.children].forEach(c => c.classList.toggle('hit', +c.dataset.pos === state.idx));
    }
    function moveSpotlight(immediate) {
      const card = grid.querySelector(`.card[data-pos="${state.idx}"] .flagbox`);
      if (!card) return;
      const gr = wrapper.getBoundingClientRect(), r = card.getBoundingClientRect();
      const inner = Math.max(90, Math.min(170, Math.min(r.width, r.height) * .95));
      spotlight.style.setProperty('--spot-x', (r.left - gr.left + r.width / 2) + 'px');
      spotlight.style.setProperty('--spot-y', (r.top - gr.top + r.height / 2) + 'px');
      spotlight.style.setProperty('--r-inner', inner + 'px');
      spotlight.style.setProperty('--r-outer', (inner + 70) + 'px');
      if (immediate) {
        spotlight.style.transition = 'none';
        requestAnimationFrame(() => { spotlight.style.transition = ''; });
      }
    }

    /* ---------- overlays ---------- */
    async function runChant() {
      chantOverlay.classList.add('show');
      const dots = [...chantDots.children];
      for (let i = 0; i < CHANT.length; i++) {
        dots.forEach((d, j) => d.classList.toggle('on', j <= i));
        chantEmoji.textContent = CHANT[i][0];
        chantWord.textContent = CHANT[i][1];
        chantEmoji.style.animation = 'none'; chantWord.style.animation = 'none';
        void chantEmoji.offsetWidth;
        chantEmoji.style.animation = ''; chantWord.style.animation = '';
        Voice.say(CHANT[i][1], true);                    // ท่อนเปิดพูดได้แม้ 🔊 ปิด
        await wait(CHANT_MS);
        if (!state.starting && !state.playing) { chantOverlay.classList.remove('show'); return false; }
      }
      dots.forEach(d => d.classList.remove('on'));
      chantOverlay.classList.remove('show');
      return true;
    }
    async function runCountdown() {
      cdOverlay.classList.add('show');
      for (const s of ['3', '2', '1']) {
        cdText.textContent = s;
        cdText.style.animation = 'none'; void cdText.offsetWidth; cdText.style.animation = '';
        await wait(s === '1' ? 500 : 700);          // เพลงเล่นต่อเนื่อง ไม่ตัดระหว่างเปลี่ยนชุด
      }
      cdOverlay.classList.remove('show');
    }

    /* ---------- loop ---------- */
    function announce() {
      Voice.say(state.deal[state.idx].th);          // เฉพาะเมื่อเปิด 🔊
    }
    async function tick() {
      if (state.busy) return;
      const next = state.idx + 1;

      if (next < PER_SET) {
        state.idx = next;
        highlight(); moveSpotlight(); updateBar(); announce();
        return;
      }
      // จบชุด
      if (state.set + 1 >= state.setCount) { stop(); return; }

      state.busy = true;
      clearInterval(state.timer); state.timer = null;
      Voice.stop();
      state.set++; state.idx = 0;
      state.deal = dealSet();
      renderSet();
      await runCountdown();
      if (!state.playing) { state.busy = false; return; }
      spotlight.classList.add('on');
      highlight(); moveSpotlight(true); updateBar(); announce();
      state.timer = setInterval(tick, tickMs());
      state.busy = false;
    }

    async function start() {
      if (state.playing || state.starting) return;
      state.starting = true;
      playBtn.disabled = true;
      Music.play();                                 // เริ่มพร้อมท่อนเปิด (คลิกปุ่มเล่น = user gesture)

      state.set = 0; state.idx = 0;
      state.deal = dealSet();
      renderSet();

      playIcon.textContent = '⏸️'; playText.textContent = 'หยุด';

      const ok = await runChant();
      if (!ok) { state.starting = false; playBtn.disabled = false; resetIdle(); return; }

      state.playing = true;
      state.starting = false;
      playBtn.disabled = false;
      spotlight.classList.add('on');
      highlight(); moveSpotlight(true); updateBar(); announce();
      state.timer = setInterval(tick, tickMs());
    }

    function stop() {
      state.playing = false; state.starting = false; state.busy = false;
      clearInterval(state.timer); state.timer = null;
      Voice.stop();
      Music.stop();
      playIcon.textContent = '▶️'; playText.textContent = 'เล่น';
      playBtn.disabled = false;
      cdOverlay.classList.remove('show'); chantOverlay.classList.remove('show');
      resetIdle();
    }
    function resetIdle() {
      spotlight.classList.remove('on');
      state.set = 0; state.idx = 0;
      state.deal = dealSet();
      renderSet();
      bar.style.width = '0%';
    }
    function goToSet(i) {
      if (i < 0 || i >= state.setCount) return;
      state.set = i; state.idx = 0;
      state.deal = dealSet();
      renderSet();
    }
    function restartTimer() {
      if (state.playing && state.timer) {
        clearInterval(state.timer);
        state.timer = setInterval(tick, tickMs());
      }
    }

    /* ---------- controls ---------- */
    playBtn.addEventListener('click', () => { state.playing ? stop() : start(); });
    $('prevSet').addEventListener('click', () => { if (state.playing) stop(); goToSet((state.set - 1 + state.setCount) % state.setCount); });
    $('nextSet').addEventListener('click', () => { if (state.playing) stop(); goToSet((state.set + 1) % state.setCount); });

    /* ---------- จำนวนชุดต่อรอบ (5 / 10) ---------- */
    function syncCountButtons() {
      SET_CHOICES.forEach(n => {
        const b = countBtns[n];
        b.classList.toggle('on', n === state.setCount);
        b.setAttribute('aria-pressed', n === state.setCount ? 'true' : 'false');
      });
    }
    function setSetCount(n) {
      if (n === state.setCount) return;
      if (state.playing || state.starting) stop();   // กันเกมเดินคาบเกี่ยวสองค่า
      state.setCount = n;
      try { localStorage.setItem('flagGame.setCount', String(n)); } catch (e) { }
      buildPills();
      goToSet(0);                                   // กลับชุด 1 + สุ่มธงใหม่ + รีเซ็ตปุ่มเฉลย
      syncCountButtons();
    }
    SET_CHOICES.forEach(n => countBtns[n].addEventListener('click', () => setSetCount(n)));

    revealAllBtn.addEventListener('click', () => {
      const target = !allRevealed();
      state.answers.forEach(b => setAnswer(b, target));
      syncRevealAll();
    });

    speedEl.addEventListener('input', e => {
      state.level = +e.target.value;
      speedLabel.textContent = 'ระดับ ' + state.level;
      updateSpeedNotice();
      restartTimer();
    });

    $('ttsBtn').addEventListener('click', e => {
      state.ttsOn = !state.ttsOn;
      e.currentTarget.classList.toggle('on', state.ttsOn);
      e.currentTarget.textContent = state.ttsOn ? '🔊' : '🔈';
      if (!state.ttsOn) Voice.stop();
      updateVoiceNotice(); restartTimer();
    });
    musicBtn.addEventListener('click', e => {
      state.musicOn = !state.musicOn;
      e.currentTarget.classList.toggle('on', state.musicOn);
      e.currentTarget.textContent = state.musicOn ? '🎵' : '🔇';
      if (state.musicOn) { if (state.playing || state.starting) Music.resume(); }
      else Music.pause();
      updateMusicNotice();
    });
    volumeEl.addEventListener('input', e => Music.setVolume(+e.target.value / 100));
    musicFile.addEventListener('change', e => {
      const f = e.target.files && e.target.files[0];
      if (f) Music.loadFile(f);
      e.target.value = '';
    });
    $('fsBtn').addEventListener('click', toggleFs);
    function toggleFs() {
      if (document.fullscreenElement) document.exitFullscreen();
      else document.documentElement.requestFullscreen?.();
    }

    document.addEventListener('keydown', e => {
      if (e.target.tagName === 'INPUT') return;
      if (e.code === 'Space') { e.preventDefault(); state.playing ? stop() : start(); }
      else if (e.key === 'ArrowRight') { if (state.playing) stop(); goToSet((state.set + 1) % state.setCount); }
      else if (e.key === 'ArrowLeft') { if (state.playing) stop(); goToSet((state.set - 1 + state.setCount) % state.setCount); }
      else if (e.key === 'f' || e.key === 'F') { toggleFs(); }
    });
    window.addEventListener('resize', () => moveSpotlight(true));
    window.addEventListener('scroll', () => moveSpotlight());

    /* ---------- แถบแจ้งเตือน (เรียงตามความสำคัญ: เพลง > เสียงอ่าน > ความเร็ว) ---------- */
    function updateMusicNotice() {
      if (state.musicOn && Music.failed) {
        noticeEl.textContent = '🎵 โหลดเพลงไม่ได้ — ตรวจว่ามีไฟล์ ' + MUSIC_SRC
          + ' อยู่ข้างไฟล์เกม หรือกดปุ่ม “เลือกเพลง” เพื่อเลือกไฟล์เอง (เกมยังเล่นได้ปกติ)';
        noticeEl.classList.add('show');
      } else {
        updateVoiceNotice();
      }
    }
    function updateVoiceNotice() {
      if (state.musicOn && Music.failed) return;      // ปล่อยให้ข้อความเรื่องเพลงค้างไว้ก่อน
      if (state.ttsOn && !Voice.thai) {
        noticeEl.innerHTML = '🔈 เครื่องนี้ไม่มีเสียงอ่านภาษาไทย — ปุ่มเฉลยด้วยเสียงจะไม่ทำงาน '
          + '(Windows: Settings → Time &amp; language → Language → เพิ่ม ไทย แล้วติดตั้ง Speech)';
        noticeEl.classList.add('show');
      } else {
        updateSpeedNotice();
      }
    }
    function updateSpeedNotice() {
      if (state.ttsOn && Voice.thai && SPEED_MS[state.level] < TTS_MIN_MS) {
        noticeEl.textContent = '⏱ เปิดเสียงเฉลยอยู่ — จำกัดจังหวะไว้ที่ 800 มิลลิวินาที เพื่อให้อ่านชื่อจบคำ (ปิด 🔊 เพื่อใช้ความเร็วเต็ม)';
        noticeEl.classList.add('show');
      } else {
        noticeEl.classList.remove('show');
      }
    }

    /* ---------- ตรวจข้อมูลด้วยตัวเอง ---------- */
    window.__selfCheck = function () {
      const names = POOL.map(c => c.th);
      const dup = names.filter((n, i) => names.indexOf(n) !== i);

      const badFlags = [];
      POOL.forEach(c => {
        try {
          const s = svg(c.f());
          if (!/^<svg /.test(s) || /undefined|NaN/.test(s)) badFlags.push(c.th);
        } catch (e) { badFlags.push(c.th + ' → ' + e.message); }
      });

      let wrongSize = 0, dupeInRow = 0, dupeAcrossRows = 0;
      for (let t = 0; t < 300; t++) {
        const d = dealSet();
        if (d.length !== PER_SET || d.some(x => POOL.indexOf(x) < 0)) wrongSize++;
        let o = 0, seen = new Set(), across = false;
        for (const n of ROW_SIZES) {
          const row = d.slice(o, o + n);
          if (new Set(row).size !== n) dupeInRow++;
          row.forEach(x => { if (seen.has(x)) across = true; seen.add(x); });
          o += n;
        }
        if (across) dupeAcrossRows++;
      }

      const res = {
        countries: POOL.length, cardsPerSet: PER_SET, rows: ROW_SIZES, sets: state.setCount,
        duplicateNames: dup, badFlags,
        dealWrongSize: wrongSize, dealDupeInsideRow: dupeInRow,
        dealDupeAcrossRows: dupeAcrossRows + '/300 (ปกติ — ข้ามแถวซ้ำได้)',
        pass: POOL.length === 7 && !dup.length && !badFlags.length && !wrongSize && !dupeInRow
      };
      console.log(res.pass ? '✅ ข้อมูลผ่านครบ' : '❌ ข้อมูลมีปัญหา', res);
      return res;
    };

    /* ---------- boot ---------- */
    function showFatal(msg) {
      noticeEl.textContent = '⚠️ เกมทำงานผิดพลาด: ' + msg;
      noticeEl.classList.add('show');
    }
    window.addEventListener('error', e => showFatal(e.message));

    try {
      try {                                          // จำจำนวนชุดที่ครูเลือกไว้รอบก่อน
        const saved = parseInt(localStorage.getItem('flagGame.setCount'), 10);
        if (SET_CHOICES.indexOf(saved) >= 0) state.setCount = saved;
      } catch (e) { }
      syncCountButtons();
      Music.init(bgm);
      buildPills();
      state.deal = dealSet();
      renderSet();
      Voice.scan();
      updateMusicNotice();
    } catch (err) {
      showFatal(err && err.message ? err.message : String(err));
      throw err;
    }
  </script>
</body>
